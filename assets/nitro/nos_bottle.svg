           A70 70 0 0 1 328 222 V850
           Q328 905 270 905 H66
           Q8 905 8 850 V222
           A70 70 0 0 1 78 152 H130 V105 H100 V50 H130 Z"/>

  <!-- Blue valve notch: solid fill -->
