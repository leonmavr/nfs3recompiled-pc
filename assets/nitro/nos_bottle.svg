      <rect width="368" height="930" fill="#fff"/>
      <g fill="#000">
    <!-- N -->
    <path d="M62 435 V368 H90 L106 402 V368 H132 V435 H105 L88 401 V435 Z"/>
    <!-- O -->
    <path fill-rule="evenodd" d="M140 392 H188 V435 H140 Z M155 404 V423 H173 V404 Z"/>
    <!-- S -->
    <path d="M196 392 H244 V404 H216 V408 H244 V435 H196 V423 H224 V419 H196 Z"/>
    <!-- arrow: shaft + head -->
